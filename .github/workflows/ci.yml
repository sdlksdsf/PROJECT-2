name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Type-check browser and website
        run: npm run typecheck

      - name: Unit tests
        run: npm run test
        continue-on-error: true

      - name: Build browser bundles
        run: npm run build

      - name: Build website
        run: npm run build:site

      - name: Upload website preview
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 7
