name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Type-check, build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Type-check browser and website
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build browser bundles
        run: npm run build

      - name: Build website
        run: npm run build:site

      - name: Upload website preview
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 7

  launch:
    name: Launch the packaged app (Xvfb)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build bundles and an unpacked Linux app
        run: |
          npm run build
          npx electron-builder --config electron-builder.yml --linux dir --publish never
        working-directory: browser

      - name: Install Xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Load real sites, close a tab, capture a screenshot
        id: launch
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$PWD/.smoke"
          export KIMMINO_SMOKE=1
          mkdir -p "$XDG_CONFIG_HOME"

          APP=$(find browser/release/linux-unpacked -maxdepth 1 -type f -executable -name 'Kimmino*' | head -1)
          if [ -z "$APP" ]; then
            echo "no executable found in browser/release/linux-unpacked" | tee smoke.out
            ls -la browser/release/linux-unpacked | tee -a smoke.out
            exit 1
          fi
          echo "launching $APP"

          # KIMMINO_SMOKE drives the real tab manager: it loads the sites that
          # were reported broken, closes a tab, captures a screenshot and exits
          # with a non-zero status if any check fails. A timeout is a failure,
          # not the expected end of the run.
          timeout --signal=TERM 300 xvfb-run -a --server-args="-screen 0 1440x900x24" \
            "$APP" --no-sandbox --disable-gpu > smoke.out 2>&1

          echo "--- smoke ---"
          cat smoke.out

          LOG="$XDG_CONFIG_HOME/Kimmino/startup.log"
          echo "--- startup.log ---"
          if [ -f "$LOG" ]; then cat "$LOG"; else echo "(missing: $LOG)"; fi

          grep -q "boot ok" "$LOG"
          grep -q "window shown" "$LOG"
          grep -Eq "SMOKE ok +loads www.google.com" smoke.out
          grep -Eq "SMOKE ok +loads www.youtube.com" smoke.out
          grep -Eq "SMOKE ok +closes a tab" smoke.out
          grep -Eq "SMOKE ok +captures a screenshot" smoke.out
          grep -q "SMOKE smoke ok" smoke.out
          grep -q "SMOKE memory" smoke.out || true

          echo "launch verified: real pages load, tabs close, screenshots capture"

          # The numbers behind the claims on the download page, published as a
          # check annotation so they can be read without downloading artifacts.
          SUMMARY=$(grep -E "SMOKE (ok|fail|memory)" smoke.out | tr '\n' ';' || true)
          echo "::notice title=Kimmino packaged-app smoke::${SUMMARY}"

      - name: Report launch failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$PWD/.smoke/Kimmino/startup.log" ]; then
            cp "$PWD/.smoke/Kimmino/startup.log" smoke-startup.log
          else
            cp smoke.out smoke-startup.log
          fi
          node tools/report-build-failure.mjs smoke-startup.log "Packaged app launch (Xvfb)"

      - name: Keep the launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-log
          path: |
            smoke.out
            .smoke/Kimmino/startup.log
          if-no-files-found: warn
          retention-days: 7
