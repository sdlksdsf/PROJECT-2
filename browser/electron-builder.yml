appId: com.kimmino.browser
productName: Kimmino
copyright: Copyright © 2026 Kimmino Contributors
artifactName: Kimmino-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: resources
extraResources:
  - from: resources/filters
    to: filters
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asar: true
asarUnpack:
  - resources/**
compression: maximum
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: resources/icon.png
  publisherName: Kimmino
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Kimmino
  installerIcon: resources/icon.png
  uninstallerIcon: resources/icon.png
  license: LICENSE.txt
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.productivity
  icon: resources/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    NSLocationWhenInUseUsageDescription: Kimmino blocks location access by default.
    NSMicrophoneUsageDescription: Only used when you allow a site to use your microphone.
    NSCameraUsageDescription: Only used when you allow a site to use your camera.
dmg:
  title: Kimmino ${version}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
  category: Network;WebBrowser
  icon: resources/icon.png
  desktop:
    entry:
      Name: Kimmino
      Comment: Fast, private, open-source browser
      Categories: Network;WebBrowser;Security;
      MimeType: text/html;x-scheme-handler/http;x-scheme-handler/https;
appImage:
  artifactName: Kimmino-${version}-linux-${arch}.AppImage
deb:
  artifactName: kimmino_${version}_${arch}.deb
publish: null
